<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>External link warning</title>
  <style>
    /* ── Prism tokens: light / default ─────────────────────────── */
    :root,
    [data-theme="light"],
    [data-theme="default"] {
      color-scheme: light;
      --bg-page: #F1F4F6;
      --bg-card: #FFFFFF;
      --bg-nav: #FFFFFF;
      --bg-url: #F7F9FA;
      --nav-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
      --border-card: #DFE3E8;
      --border-url: #DFE3E8;
      --card-shadow: 0 8px 24px rgba(35, 35, 51, 0.10);
      --text-title: #222325;
      --text-body: #686F79;
      --text-strong: #222325;
      --text-url: #555B62;
      --text-placeholder: #939BA4;
      --fill-primary: #0E71EB;
      --btn-hover: #0D65D4;
      --btn-press: #0C5CC4;
      --btn-text: #FFFFFF;
      --focus-ring: #0E71EB;
      --icon-info: #0E71EB;
      --icon-error: #DA1639;
      --icon-error-mark: #FFFFFF;
    }

    /* ── Prism tokens: dark ─────────────────────────────────────── */
    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #1D1E20;
      --bg-card: #313235;
      --bg-nav: #1D1E20;
      --bg-url: #2A2B2D;
      --nav-shadow: 0 1px 0 rgba(255, 255, 255, 0.06);
      --border-card: transparent;
      --border-url: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
      --text-title: #F7F9FA;
      --text-body: #DFE3E8;
      --text-strong: #F7F9FA;
      --text-url: #DFE3E8;
      --text-placeholder: #939BA4;
      --fill-primary: #0E71EB;
      --btn-hover: #0D65D4;
      --btn-press: #0C5CC4;
      --btn-text: #FFFFFF;
      --focus-ring: #4B96F1;
      --icon-info: #0E71EB;
      --icon-error: #FF6682;
      --icon-error-mark: #1D1E20;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-title);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav {
      height: 56px;
      background: var(--bg-nav);
      box-shadow: var(--nav-shadow);
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 24px;
      text-align: left;
      animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      display: block;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.01em;
      color: var(--text-title);
    }

    .card-body {
      font-size: 14px;
      line-height: 22px;
      color: var(--text-body);
      margin-bottom: 16px;
    }

    .card-body strong {
      color: var(--text-strong);
      font-weight: 700;
    }

    .url-field {
      display: block;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      margin-bottom: 20px;
      background: var(--bg-url);
      border: 1px solid var(--border-url);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      line-height: 22px;
      color: var(--text-url);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .url-field::placeholder {
      color: var(--text-placeholder);
    }

    .url-field:focus-visible {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 1px var(--focus-ring);
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      min-height: 32px;
    }

    .btn-proceed {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 16px;
      background: var(--fill-primary);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }

    .btn-proceed:hover {
      background: var(--btn-hover);
    }

    .btn-proceed:active {
      background: var(--btn-press);
    }

    .btn-proceed:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }
    }

    @media (max-width: 599px) {
      .nav {
        padding: 0 16px;
      }

      .main {
        align-items: flex-start;
        padding: 24px 16px 16px;
      }

      .card {
        padding: 20px;
      }

      .card-title {
        font-size: 18px;
        line-height: 24px;
      }
    }
  </style>
</head>

<body>
  <nav class="nav" aria-label="Zoom">
    <svg width="90" height="20" viewBox="0 0 90 20" fill="none" aria-label="Zoom logo" role="img">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M36.1691 17.0711C40.0314 13.1658 40.0314 6.83418 36.1691 2.92895C34.2395 0.97793 31.711 0.00161441 29.1694 0C26.6404 0.00161441 24.1119 0.97793 22.1824 2.92895C18.32 6.83418 18.32 13.1658 22.1824 17.0711C26.0447 20.9763 32.3068 20.9763 36.1691 17.0711ZM33.3717 14.2425C35.6891 11.8993 35.6891 8.10037 33.3717 5.75722C31.0543 3.41406 27.2971 3.41406 24.9797 5.75722C22.6623 8.10037 22.6623 11.8993 24.9797 14.2425C27.2971 16.5856 31.0543 16.5856 33.3717 14.2425ZM57.4327 2.92895C61.2951 6.83418 61.2951 13.1658 57.4327 17.0711C53.5704 20.9763 47.3084 20.9763 43.446 17.0711C39.5837 13.1658 39.5837 6.83418 43.446 2.92895C45.3756 0.97793 47.9041 0.00161441 50.4331 0C52.9747 0.00161441 55.5032 0.97793 57.4327 2.92895ZM54.6354 5.75722C56.9528 8.10037 56.9528 11.8993 54.6354 14.2425C52.318 16.5856 48.5607 16.5856 46.2434 14.2425C43.9259 11.8993 43.9259 8.10037 46.2434 5.75722C48.5607 3.41406 52.318 3.41406 54.6354 5.75722ZM74.1262 8C74.0879 7.24898 73.9816 6.58351 73.6428 5.99375C72.9579 4.80159 71.6813 4 70.2196 4C68.7592 4 67.4837 4.80005 66.7983 5.99029C66.4583 6.58083 66.3547 7.24786 66.313 8L66.2635 9V16L66.2141 17.0004C66.1495 18.6605 64.9483 19.8401 63.2965 19.95L62.3075 20V0C63.2965 0 65.019 0.505638 65.7885 1.37131C67.0527 0.505638 68.5777 0 70.2196 0C72.5827 0 74.7039 1.04751 76.1536 2.70835C77.6034 1.04751 79.7246 0 82.0877 0C86.4574 0 89.9998 3.58172 89.9998 8V9.00903V20L89.0117 19.95C87.3775 19.8542 86.1958 18.644 86.0932 16.999L86.0437 16V8.99893L85.9943 8C85.9551 7.26721 85.8509 6.58767 85.514 5.99912C84.8299 4.804 83.5516 4 82.0877 4C80.629 4 79.3547 4.79826 78.6688 5.98632C78.3273 6.57775 78.2197 7.25832 78.1811 8L78.1317 9V20L77.1436 19.95C75.5118 19.8455 74.3229 18.6344 74.2251 16.999L74.1756 16V9L74.1262 8ZM4.94506 20L3.95604 19.95C2.31347 19.8406 1.13603 18.6476 1.03846 16.9991L0.989011 16L12.8571 4H3.95604L2.96583 3.95C1.34815 3.85556 0.177592 2.62595 0.0494498 0.999056L0 7.42403e-06L14.8352 0.000912409L15.8241 0.0499992C17.4625 0.137543 18.6634 1.34167 18.7418 3.00124L18.7912 4L6.92308 16H15.8242L16.8132 16.05C18.4453 16.1531 19.5984 17.3544 19.7308 19.0009L19.7802 20H4.94506Z"
        fill="#0E71EB" />
    </svg>
  </nav>

  <main class="main">
    <div class="card" role="dialog" aria-labelledby="cardTitle" aria-describedby="cardBody">
      <div class="card-header">
        <span class="card-icon" aria-hidden="true">
          <svg id="svgWarn" width="22" height="20" viewBox="0 0 22 20" fill="none">
            <path d="M11 1.6L20.4 18.4H1.6L11 1.6Z" fill="var(--icon-error)" stroke="var(--icon-error)"
              stroke-width="1.2" stroke-linejoin="round" />
            <path d="M11 7.6V12.4" stroke="var(--icon-error-mark)" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="11" cy="15.05" r="1.1" fill="var(--icon-error-mark)" />
          </svg>
          <svg id="svgSafe" width="20" height="20" viewBox="0 0 20 20" fill="none" style="display:none">
            <circle cx="10" cy="10" r="10" fill="var(--icon-info)" />
            <circle cx="10" cy="6.15" r="1.15" fill="#ffffff" />
            <rect x="9.05" y="8.4" width="1.9" height="6.4" rx="0.95" fill="#ffffff" />
          </svg>
        </span>
        <h1 class="card-title" id="cardTitle">Potential risk in this link</h1>
      </div>

      <p class="card-body" id="cardBody">
        This website might be trying to steal your personal information. Make sure the URL is valid and copy and paste
        the link below to continue to this site.
      </p>

      <input class="url-field" id="urlDisplay" type="text" readonly spellcheck="false" aria-label="Destination URL"
        placeholder="Placeholder" />

      <div class="card-footer" id="actionArea"></div>
    </div>
  </main>

  <script>
    /* ── Theme ──────────────────────────────────────────────────── */
    (function () {
      var m = window.location.href.match(/[?&]theme=([^&#]*)/);
      var resolved;
      if (m) {
        var t = decodeURIComponent(m[1]);
        resolved = t === 'dark' ? 'dark' : 'light';
      } else {
        resolved =
          typeof window !== 'undefined' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolved);
    }());

    /* ── URL helpers (original logic preserved) ─────────────────── */
    function getQueryString() {
      var parts = window.location.href.split('?ref=');
      var raw = parts.slice(1).join('?ref=');
      var themeAt = raw.search(/&theme=/);
      if (themeAt !== -1) raw = raw.slice(0, themeAt);
      try { return decodeURIComponent(raw); } catch (e) { return raw; }
    }

    function isURL(str) {
      return /^https:\/\/([\w-]+\.)+[\w-]+(\/[\w-./?%&=]*)?/i.test(str);
    }

    function maySpoof(url) {
      if (!url) return true;
      var inSearch = (url.search.match(/@/g) || []).length;
      var inHref = (url.href.match(/@/g) || []).length;
      return inHref !== inSearch;
    }

    function getURLInstance(ref) {
      try { return new URL(ref); } catch (e) { return undefined; }
    }

    function esc(str) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(str));
      return d.innerHTML;
    }

    /* ── Safe-state UI ──────────────────────────────────────────── */
    function applyState(isSafe, domain, href) {
      var svgWarn = document.getElementById('svgWarn');
      var svgSafe = document.getElementById('svgSafe');
      var title = document.getElementById('cardTitle');
      var body = document.getElementById('cardBody');
      var action = document.getElementById('actionArea');

      if (isSafe) {
        svgWarn.style.display = 'none';
        svgSafe.style.display = '';
        title.textContent = 'You are leaving Zoom';
        body.textContent = 'Click "Proceed" button to continue to the external site.';

        var btn = document.createElement('a');
        btn.className = 'btn-proceed';
        btn.href = href;
        btn.setAttribute('rel', 'noopener noreferrer');
        btn.textContent = 'Proceed';
        action.appendChild(btn);
      } else if (domain) {
        body.innerHTML = 'You are accessing <strong>' + esc(domain) + '</strong>. ' + body.innerHTML;
      }
    }

    /* ── Init ───────────────────────────────────────────────────── */
    var urlDisplay = document.getElementById('urlDisplay');
    var ref = getQueryString();
    urlDisplay.value = ref || '';
    urlDisplay.addEventListener('focus', function () { this.select(); });

    var URLInstance = getURLInstance(ref);
    if (URLInstance) {
      var notSpoof = !maySpoof(URLInstance);
      urlDisplay.value = URLInstance.href;

      if (isURL(ref) && notSpoof) {
        applyState(true, URLInstance.hostname, ref);
      } else {
        applyState(false, (URLInstance.username || !notSpoof) ? URLInstance.hostname : null, ref);
      }
    }
  </script>
</body>

</html>
